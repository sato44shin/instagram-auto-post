name: Instagram Auto Post

on:
  schedule:
    # 毎週 火・木・土 18:00 JST = 09:00 UTC
    - cron: "0 9 * * 2,4,6"
  workflow_dispatch: {}  # 手動実行用（テストに便利）

permissions:
  contents: write  # queue -> posted へファイルを移動してコミットするため

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Post next photo to Instagram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/post_to_instagram.py

      - name: Commit moved file
        run: |
          git config user.name "instagram-auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue posted
          git diff --cached --quiet || git commit -m "chore: mark photo as posted [skip ci]"
          git push
